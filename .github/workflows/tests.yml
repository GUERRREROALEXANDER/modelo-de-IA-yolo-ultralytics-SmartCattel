name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Render builds this file: find out here, not in a failed deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t smartcattle-live .

      - name: The service starts and answers its health check
        run: |
          docker run -d --name live -p 8090:8090 -e CAMERA_URL=rtsp://127.0.0.1:1/none smartcattle-live
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8090/health && exit 0
            sleep 2
          done
          docker logs live
          exit 1

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The CPU build of PyTorch: the CUDA one is several GB and the runner has no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-onnx.txt

      - name: Unit tests
        # Each failing test also becomes an annotation, readable without opening the log.
        run: |
          set +e
          python -m pytest -q -m "not real" -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) |^E  ' pytest.log | head -n 30 | while read -r line; do echo "::error::$line"; done
          exit $status

      - name: Real inference tests
        # Loads the committed fine-tuned model and downloads yolo11n.pt (about 5 MB) on first use.
        run: python -m pytest -q -m real
