# Render Blueprint: live.py as a Docker web service reading the camera through the Imou cloud.
services:
  - type: web
    name: smartcattle-live
    runtime: docker
    # Free instances sleep after 15 min without visitors and have 0.1 CPU; the detector needs to stay awake.
    # 2 GB and 1 CPU: the model alone took about 360 MB, and each camera adds its own frames and threads.
    plan: standard
    # A commit whose tests fail never reaches the running service.
    autoDeployTrigger: checksPass
    # Cameras added from the dashboard, which a restart would otherwise forget.
    disk:
      name: smartcattle-live-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: SMARTCATTLE_CAMERAS_FILE
        value: /data/cameras.json
      - key: SMARTCATTLE_MAX_CAMERAS
        value: "3"
      - key: IMOU_APP_ID
        sync: false
      - key: IMOU_APP_SECRET
        sync: false
      - key: IMOU_DEVICE_ID
        sync: false
      - key: IMOU_API_URL
        value: https://openapi.easy4ip.com/openapi
      - key: IMOU_PROFILE
        value: SD
      - key: CAMERA_ID
        value: camera-01
      - key: SMARTCATTLE_BACKEND_URL
        sync: false
      - key: SMARTCATTLE_API_KEY
        sync: false
      - key: SMARTCATTLE_LIVE_ORIGINS
        value: https://smartcattle-frontend.onrender.com
      # This server is not on a farm's network: refuse private addresses and webcam numbers with a clear message.
      - key: SMARTCATTLE_CLOUD
        value: "1"
      # Smaller input keeps CPU inference near real time on a shared instance.
      - key: SMARTCATTLE_IMGSZ
        value: "416"
